<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Merlington Tic-Tac-Toe</title>
  <style>
    :root { --ink: #17212b; --muted: #65727a; --paper: #f5f1e8; --panel: #fffdf8; --orange: #e56b3f; --blue: #385e72; --yellow: #f5c84b; --line: #ded6c8; }
    * { box-sizing: border-box; }
    body { display: grid; min-height: 100vh; margin: 0; place-items: center; padding: 24px; color: var(--ink); background: var(--paper); font-family: Georgia, "Times New Roman", serif; }
    main { width: min(620px, 100%); }
    header { display: flex; align-items: end; justify-content: space-between; gap: 24px; margin-bottom: 24px; }
    .eyebrow, .scoreboard, button { font-family: Arial, sans-serif; letter-spacing: 0.08em; text-transform: uppercase; }
    .eyebrow { margin: 0 0 7px; color: var(--orange); font-size: 0.72rem; font-weight: 700; }
    h1 { margin: 0; font-size: clamp(2.7rem, 9vw, 5.4rem); font-weight: 400; line-height: 0.88; letter-spacing: -0.05em; }
    .scoreboard { display: grid; grid-template-columns: repeat(3, auto); gap: 14px; color: var(--muted); font-size: 0.65rem; text-align: center; }
    .scoreboard span { display: block; margin-top: 5px; color: var(--ink); font: 700 1.3rem Georgia, serif; letter-spacing: 0; }
    .scoreboard .x span { color: var(--orange); }
    .scoreboard .o span { color: var(--blue); }
    .game-panel { padding: clamp(20px, 5vw, 38px); border: 1px solid var(--line); background: var(--panel); box-shadow: 10px 10px 0 #e8e0d2; }
    .status { display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 30px; margin-bottom: 20px; color: var(--muted); font: 0.78rem/1.4 Arial, sans-serif; }
    .turn { color: var(--ink); font-weight: 700; }
    .turn::before { display: inline-block; width: 8px; height: 8px; margin-right: 8px; border-radius: 50%; background: var(--orange); content: ""; }
    .turn.o::before { background: var(--blue); }
    .board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; aspect-ratio: 1; }
    .cell { display: grid; min-width: 0; min-height: 0; place-items: center; border: 1px solid var(--line); background: #faf7ef; color: var(--ink); cursor: pointer; font: 400 clamp(3.5rem, 16vw, 6.5rem)/1 Georgia, serif; letter-spacing: 0; text-transform: none; transition: background 140ms ease, transform 140ms ease; }
    .cell:hover:not(:disabled) { background: #f3ead9; transform: translateY(-2px); }
    .cell:focus-visible, button:focus-visible { outline: 3px solid var(--yellow); outline-offset: 3px; }
    .cell:disabled { cursor: default; }
    .cell.x { color: var(--orange); }
    .cell.o { color: var(--blue); }
    .cell.winner { background: #fff0b7; }
    .actions { display: flex; justify-content: space-between; gap: 12px; margin-top: 24px; }
    button { border: 0; padding: 13px 17px; color: var(--panel); background: var(--orange); cursor: pointer; font-size: 0.68rem; font-weight: 700; }
    button:hover { background: #c9532d; }
    button.secondary { color: var(--ink); background: #eee7d9; }
    button.secondary:hover { background: #e2d8c6; }
    .hint { margin: 22px 0 0; color: var(--muted); font: 0.75rem/1.5 Arial, sans-serif; text-align: center; }
    @media (max-width: 520px) {
      body { padding: 16px; }
      header { align-items: start; flex-direction: column; }
      .scoreboard { align-self: end; }
      .game-panel { box-shadow: 6px 6px 0 #e8e0d2; }
      .actions { flex-direction: column-reverse; }
      .actions button { width: 100%; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <p class="eyebrow">Merlington After Hours</p>
        <h1>Tic-Tac-Toe</h1>
      </div>
      <div class="scoreboard" aria-label="Match score">
        <div class="x">X wins<span id="xScore">0</span></div>
        <div>Draws<span id="drawScore">0</span></div>
        <div class="o">O wins<span id="oScore">0</span></div>
      </div>
    </header>
    <section class="game-panel" aria-label="Tic-Tac-Toe game">
      <div class="status" aria-live="polite"><span class="turn" id="turnLabel">X's turn</span><span id="roundLabel">Round 1</span></div>
      <div class="board" id="board" role="grid" aria-label="Tic-Tac-Toe board">
        <button class="cell" type="button" data-index="0" aria-label="Top left, empty" role="gridcell"></button>
        <button class="cell" type="button" data-index="1" aria-label="Top center, empty" role="gridcell"></button>
        <button class="cell" type="button" data-index="2" aria-label="Top right, empty" role="gridcell"></button>
        <button class="cell" type="button" data-index="3" aria-label="Middle left, empty" role="gridcell"></button>
        <button class="cell" type="button" data-index="4" aria-label="Center, empty" role="gridcell"></button>
        <button class="cell" type="button" data-index="5" aria-label="Middle right, empty" role="gridcell"></button>
        <button class="cell" type="button" data-index="6" aria-label="Bottom left, empty" role="gridcell"></button>
        <button class="cell" type="button" data-index="7" aria-label="Bottom center, empty" role="gridcell"></button>
        <button class="cell" type="button" data-index="8" aria-label="Bottom right, empty" role="gridcell"></button>
      </div>
      <div class="actions"><button class="secondary" id="newMatch" type="button">New match</button><button id="newRound" type="button">Reset round</button></div>
    </section>
    <p class="hint">Two players, one board. X goes first.</p>
  </main>
  <script>
    const cells = [...document.querySelectorAll(".cell")];
    const turnLabel = document.querySelector("#turnLabel");
    const roundLabel = document.querySelector("#roundLabel");
    const xScoreLabel = document.querySelector("#xScore");
    const oScoreLabel = document.querySelector("#oScore");
    const drawScoreLabel = document.querySelector("#drawScore");
    const winLines = [[0, 1, 2], [3, 4, 5], [6, 7, 8], [0, 3, 6], [1, 4, 7], [2, 5, 8], [0, 4, 8], [2, 4, 6]];
    let board = Array(9).fill("");
    let currentPlayer = "X";
    let round = 1;
    let scores = { X: 0, O: 0, draws: 0 };
    let roundOver = false;

    function updateScoreboard() {
      xScoreLabel.textContent = scores.X;
      oScoreLabel.textContent = scores.O;
      drawScoreLabel.textContent = scores.draws;
    }

    function updateStatus(text = `${currentPlayer}'s turn`) {
      turnLabel.textContent = text;
      turnLabel.className = `turn ${currentPlayer.toLowerCase()}`;
      roundLabel.textContent = `Round ${round}`;
    }

    function winningLine() {
      return winLines.find(([first, second, third]) => board[first] && board[first] === board[second] && board[first] === board[third]);
    }

    function renderBoard() {
      cells.forEach((cell, index) => {
        const value = board[index];
        cell.textContent = value;
        cell.className = `cell ${value.toLowerCase()}`;
        cell.disabled = Boolean(value) || roundOver;
        cell.setAttribute("aria-label", `${cell.getAttribute("aria-label").split(",")[0]}, ${value || "empty"}`);
      });
      updateScoreboard();
    }

    function finishRound(line) {
      roundOver = true;
      if (line) {
        const winner = board[line[0]];
        scores[winner] += 1;
        line.forEach((index) => cells[index].classList.add("winner"));
        updateStatus(`${winner} wins the round`);
      } else {
        scores.draws += 1;
        updateStatus("It's a draw");
      }
      renderBoard();
    }

    function play(index) {
      if (roundOver || board[index]) return;
      board[index] = currentPlayer;
      const line = winningLine();
      if (line || board.every(Boolean)) {
        finishRound(line);
        return;
      }
      currentPlayer = currentPlayer === "X" ? "O" : "X";
      updateStatus();
      renderBoard();
    }

    function resetRound() {
      board = Array(9).fill("");
      currentPlayer = "X";
      roundOver = false;
      updateStatus();
      renderBoard();
    }

    cells.forEach((cell) => cell.addEventListener("click", () => play(Number(cell.dataset.index))));
    document.querySelector("#newRound").addEventListener("click", () => { round += 1; resetRound(); });
    document.querySelector("#newMatch").addEventListener("click", () => { round = 1; scores = { X: 0, O: 0, draws: 0 }; resetRound(); });
    renderBoard();
  </script>
</body>
</html>
